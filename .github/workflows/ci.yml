name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The game's real gates are four Godot harnesses that need the engine, ~5 GB of
  # models and a GPU, so they run on the developer's machine rather than here
  # (godot/docs/Testing.md). What CI can honestly check is that everything
  # parses and that nothing has reintroduced the server.
  python-syntax:
    name: Art tooling syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q scripts

  powershell-syntax:
    name: Installer syntax (PSParser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; Write-Host "::error file=$($_.FullName)::$($errs[0].Message)" }
          }
          if ($bad) { exit 1 } else { Write-Host "all PowerShell parses" }

  no-server:
    name: Nothing talks to a server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # The game has no server, and this is what keeps it that way. An /api/
      # call from the game, or a launcher starting a web app, means something
      # has quietly reintroduced a dependency the game does not have. The image
      # engine is the one allowed network call, and it is not an /api/ path.
      - name: The game must not call an HTTP API
        run: |
          if grep -rn '"/api/' godot --include=*.gd; then
            echo "::error::the game made an /api/ call — there is no server"
            exit 1
          fi
          if grep -rln 'uvicorn\|app:app\|flask\|FastAPI(' --include=*.ps1 --include=*.cmd --include=*.py .; then
            echo "::error::something launches a web server — the game is the whole application"
            exit 1
          fi
          echo "clean: no server, no callers"
