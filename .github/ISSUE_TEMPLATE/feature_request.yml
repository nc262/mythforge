name: Feature Request
description: Propose a new feature or a concrete improvement to Mythforge.
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** check
        [godot/docs/Backlog.md](https://github.com/nc262/mythforge/blob/main/godot/docs/Backlog.md)
        and [FeatureMatrix.md](https://github.com/nc262/mythforge/blob/main/godot/docs/FeatureMatrix.md).
        Most things are already tracked, including the ones deliberately not built.

        If your idea needs discussion before it becomes a concrete proposal,
        start a [discussion](https://github.com/nc262/mythforge/discussions/categories/ideas) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I checked the Backlog and the Feature Matrix and this is not already tracked.
          required: true
        - label: This is a concrete, actionable proposal — not "it would be nice if…".
          required: true
        - label: This does not require the model to decide a mechanical outcome. The engine decides; the model narrates.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "-- Please Select --"
        - Rules / combat / progression
        - The Game Master (prompting, memory, pacing)
        - World forging / the World Compiler
        - Art and the image engine
        - UI, the design system, a ritual screen
        - Saves, chronicles, persistence
        - Audio
        - Accessibility
        - Tooling / build / installer
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What does this solve at the table? "It would be better" is not enough — describe the moment in play where the current behaviour disappoints.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The behaviour you want. A UI sketch, a tag shape, or a snippet helps make it concrete.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What does it cost per turn?
      description: If this adds a model call, an image, or work inside the turn loop, say so. Latency is a design constraint here, not a footnote.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why rule it out? If there is a workaround today, describe it.

  - type: dropdown
    id: willing_to_implement
    attributes:
      label: Are you willing to implement this?
      options:
        - "-- Please Select --"
        - "Yes — I can open a PR"
        - "Partially — I can help but need guidance"
        - "No — I am only filing the request"
    validations:
      required: true
