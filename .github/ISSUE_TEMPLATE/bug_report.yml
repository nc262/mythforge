name: Bug Report
description: Report a reproducible bug in Mythforge.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** search [open issues](https://github.com/nc262/mythforge/issues) first.

        For security vulnerabilities, **do not open a public issue** —
        use [GitHub Security Advisories](https://github.com/nc262/mythforge/security/advisories/new)
        and read [SECURITY.md](https://github.com/nc262/mythforge/blob/main/SECURITY.md) first.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [open issues](https://github.com/nc262/mythforge/issues?q=is%3Aissue+is%3Aopen) and did not find an existing report of this bug.
          required: true
        - label: This is **not** a security vulnerability.
          required: true
        - label: I checked [godot/docs/Backlog.md](https://github.com/nc262/mythforge/blob/main/godot/docs/Backlog.md) and [KnownIssues.md](https://github.com/nc262/mythforge/blob/main/godot/docs/KnownIssues.md) — this is not already tracked.
          required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - "-- Please Select --"
        - The installer (Mythforge-Setup.exe)
        - An exported exe I built myself
        - From source, in the Godot editor
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Which narrator model?
      description: The `.gguf` filename in `user://models`. This matters more than anything else in the report — a different model is a different Game Master.
      placeholder: "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      description: Run `scripts/check-system.ps1` if you are not sure.
      placeholder: "Radeon RX 7900 GRE, 16 GB"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that reliably trigger it. If it involves the GM, include the line you typed.
      placeholder: |
        1. Continue an adventure at day 4
        2. Type "I attack the jotun"
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error if there is one. If the GM said something wrong, paste its whole reply — the surrounding text is usually where the cause is.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output or screenshots. Saves are plain JSON and may contain your campaign text — check before pasting one.
      render: text

  - type: dropdown
    id: willing_to_fix
    attributes:
      label: Are you willing to submit a fix?
      options:
        - "-- Please Select --"
        - "Yes — I can open a PR"
        - "Partially — I can help but need guidance"
        - "No — I am only filing the report"
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Anything else
      description: Related issues, things you already tried, environment quirks.
