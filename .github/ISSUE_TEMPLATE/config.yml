blank_issues_enabled: false
contact_links:
  - name: Question / Need Help
    url: https://github.com/nc262/mythforge/discussions/categories/q-a
    about: Setup help, "which model should I use", how-to questions. Issues are for confirmed bugs and concrete proposals only.

  - name: Idea or Suggestion
    url: https://github.com/nc262/mythforge/discussions/categories/ideas
    about: Gauge interest before opening a formal feature request. If a discussion already exists, link it.

  - name: Security Vulnerability
    url: https://github.com/nc262/mythforge/security/advisories/new
    about: Report privately via GitHub Security Advisories — never as a public issue. Read SECURITY.md first.
